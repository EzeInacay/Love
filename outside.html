<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Outside</title>
<style>
* { box-sizing:border-box; }
body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; font-family:monospace; }
.game { width:360px; height:640px; overflow:hidden; position:relative; background:#1a3a1a; image-rendering:pixelated; }
.world { width:480px; height:800px; position:absolute; background:#1a3a1a; image-rendering:pixelated; }

/* SKY */
.sky {
  position:absolute; top:0;left:0;right:0; height:140px;
  background:linear-gradient(to bottom,#1a2a4a 0%,#2a3a5a 60%,#3a5030 100%);
}
/* STARS */
.sky::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle,#fff 1px,transparent 1px) 30px 20px/60px 40px,
    radial-gradient(circle,#fff 1px,transparent 1px) 80px 10px/80px 50px,
    radial-gradient(circle,#fff 1px,transparent 1px) 200px 30px/90px 35px,
    radial-gradient(circle,#fff 1px,transparent 1px) 300px 15px/70px 45px,
    radial-gradient(circle,rgba(255,255,255,0.5) 1px,transparent 1px) 50px 35px/100px 60px;
  opacity:0.5;
}

/* GROUND layers */
.ground-yard {
  position:absolute; left:0;right:0; top:100px; height:660px;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,0.06) 0px,rgba(0,0,0,0.06) 1px,transparent 1px,transparent 12px),
    #2a4a1e;
}
.ground-path {
  position:absolute; left:50%; transform:translateX(-50%); top:100px; width:60px; height:660px;
  background:repeating-linear-gradient(to bottom,#4a3e28 0px,#4a3e28 20px,#3a2e1e 20px,#3a2e1e 24px);
}
.sidewalk {
  position:absolute; left:0;right:0; bottom:0; height:60px;
  background:repeating-linear-gradient(90deg,#5a5a4a 0px,#5a5a4a 40px,#4a4a3a 40px,#4a4a3a 42px);
  border-top:3px solid #3a3a2a;
}

/* HOUSE FACADE */
.house {
  position:absolute; top:40px; left:50%; transform:translateX(-50%);
  width:280px; height:100px;
  background:repeating-linear-gradient(90deg,#5a4a3a 0px,#5a4a3a 4px,#4a3a2a 4px,#4a3a2a 16px);
  border-bottom:4px solid #2a1a0a;
}
/* ROOF */
.house::before {
  content:''; position:absolute;
  top:-44px; left:-10px; right:-10px; height:0;
  border-left:0px solid transparent;
  border-right:0px solid transparent;
  border-bottom:44px solid #3a2a1a;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  /* Triangle roof trick */
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  background:#4a3520;
  height:44px; top:-44px; left:0; right:0;
}
/* HOUSE WINDOWS */
.window {
  position:absolute; top:15px;
  width:36px; height:36px;
  background:linear-gradient(135deg,#1a2848,#0d3060,#1a4a88);
  border:3px solid #7a5a3a;
  border-radius:2px;
}
.window::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(90deg,transparent 48%,rgba(255,255,255,0.15) 48%,rgba(255,255,255,0.15) 52%,transparent 52%),
              linear-gradient(transparent 48%,rgba(255,255,255,0.15) 48%,rgba(255,255,255,0.15) 52%,transparent 52%);
}

/* FRONT DOOR of house */
.house-door {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:44px; height:64px;
  background:#6a4a2a;
  border:3px solid #3a2a0a;
  border-bottom:none;
}
.house-door::after {
  content:''; position:absolute; width:8px; height:8px;
  background:#d4aa40; border-radius:50%; right:8px; top:28px;
}

.object { position:absolute; image-rendering:pixelated; }

/* FENCE */
.fence-h { position:absolute; height:12px; background:repeating-linear-gradient(90deg,#7a6040 0px,#7a6040 8px,#2a1a0a 8px,#2a1a0a 12px); border-top:3px solid #5a4020; }
.fence-v { position:absolute; width:12px; background:repeating-linear-gradient(to bottom,#7a6040 0px,#7a6040 8px,#2a1a0a 8px,#2a1a0a 12px); border-left:3px solid #5a4020; }

/* GATE (fence gap at bottom center) */
.gate {
  position:absolute;
  width:50px; height:50px;
  background:transparent;
  border:3px solid #7a6040;
  border-top:none;
}
.gate::after {
  content:'GATE'; position:absolute; top:-18px; left:4px;
  font-size:8px; color:rgba(255,200,80,0.5); font-family:monospace;
}

/* MAILBOX */
.mailbox {
  width:18px; height:14px;
  background:#5a3a2a;
  border:2px solid #3a1a0a;
  border-radius:2px 2px 0 0;
}
.mailbox::before {
  content:''; position:absolute;
  bottom:-12px; left:7px; width:4px; height:12px;
  background:#4a3020; border:1px solid #2a1000;
}

/* TREE */
.tree { width:16px; height:40px; }
.tree::before { /* trunk */
  content:''; position:absolute;
  bottom:0; left:5px; width:6px; height:16px;
  background:#5a3a1a; border:1px solid #3a1a00;
}
.tree::after { /* leaves */
  content:''; position:absolute;
  top:0; left:-4px; width:24px; height:28px;
  background:#2a6020; border:2px solid #1a4010;
  border-radius:50% 50% 40% 40%;
  box-shadow:0 0 0 4px #1e4818;
}

/* TOWN EXIT SIGN at very bottom */
.town-sign {
  position:absolute; bottom:70px; left:50%; transform:translateX(-50%);
  background:#2a1a0a; border:2px solid #c8a030; color:#c8a030;
  font-family:monospace; font-size:9px; padding:3px 8px; white-space:nowrap; border-radius:2px;
}

/* HEART */
.heart { position:absolute; width:0; height:0; z-index:50; }
.heart::before {
  content:''; position:absolute; width:4px; height:4px; background:#ff2a2a;
  box-shadow:4px 0 #ff2a2a,8px 0 #ff2a2a,16px 0 #ff2a2a,20px 0 #ff2a2a,0 4px #ff2a2a,4px 4px #ff4444,8px 4px #ff4444,12px 4px #ff2a2a,16px 4px #ff4444,20px 4px #ff4444,24px 4px #ff2a2a,0 8px #ff2a2a,4px 8px #ff4444,8px 8px #ff6666,12px 8px #ff4444,16px 8px #ff6666,20px 8px #ff4444,24px 8px #ff2a2a,4px 12px #ff2a2a,8px 12px #ff4444,12px 12px #ff4444,16px 12px #ff4444,20px 12px #ff2a2a,8px 16px #ff2a2a,12px 16px #ff4444,16px 16px #ff2a2a,12px 20px #cc1a1a;
}

/* LIGHTING — night time */
.darkness { position:absolute; inset:0; pointer-events:none; z-index:40; background:rgba(0,5,20,0.65); }
.spotlight { position:absolute; pointer-events:none; z-index:41; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(200,230,255,0.22) 0%,rgba(150,200,255,0.08) 40%,transparent 70%); mix-blend-mode:screen; }

/* DIALOG */
.dialog { position:absolute; bottom:180px; left:10px; right:10px; background:rgba(0,0,0,0.93); color:#fff; border:2px solid #888; padding:10px 12px; display:none; z-index:100; font-size:13px; line-height:1.5; border-radius:4px; font-family:monospace; }
.dialog button { margin:6px 4px 0 0; padding:4px 10px; background:#222; color:#fff; border:1px solid #666; cursor:pointer; font-family:monospace; font-size:12px; border-radius:2px; }
.dialog button:hover { background:#444; }
.hint { position:absolute; background:rgba(0,0,0,0.8); color:#ffcc00; font-size:10px; padding:2px 5px; border-radius:2px; white-space:nowrap; pointer-events:none; z-index:60; display:none; font-family:monospace; }

#phone-btn { position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:8px; background:#111; color:white; border:1px solid #555; font-size:18px; z-index:200; cursor:pointer; }
.controls { position:absolute; bottom:20px; left:16px; display:grid; grid-template-columns:44px 44px 44px; grid-template-rows:44px 44px; gap:5px; z-index:150; }
.btn { background:rgba(20,30,20,0.88); color:#aac8aa; border:1px solid #3a5a3a; border-radius:8px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; touch-action:none; }
.btn:active { background:rgba(50,80,50,0.9); }
.up{grid-column:2;grid-row:1;}.left{grid-column:1;grid-row:2;}.down{grid-column:2;grid-row:2;}.right{grid-column:3;grid-row:2;}
.interact { position:absolute; bottom:24px; right:20px; width:64px; height:64px; background:rgba(20,30,20,0.92); border-radius:50%; border:2px solid #4a6a4a; z-index:150; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#aad8aa; font-size:11px; font-family:monospace; user-select:none; }
.interact:active { background:rgba(50,80,50,0.9); }
</style>
</head>
<body>
<div class="game" id="game">
  <div class="world" id="world">
    <!-- SKY -->
    <div class="sky"></div>

    <!-- GROUND -->
    <div class="ground-yard"></div>
    <div class="ground-path"></div>
    <div class="sidewalk"></div>

    <!-- HOUSE (top center) -->
    <div class="house">
      <div class="window" style="left:30px;"></div>
      <div class="window" style="right:30px;"></div>
      <div class="house-door" id="door-house" data-text="The front door of the house. Back to the living room."></div>
    </div>

    <!-- FENCES — left, right, bottom with gap in center -->
    <div class="fence-h" style="top:100px;left:0;width:480px;"></div>     <!-- top fence along yard -->
    <div class="fence-v" style="top:100px;left:0;width:12px;height:640px;"></div>    <!-- left -->
    <div class="fence-v" style="top:100px;right:0;width:12px;height:640px;"></div>   <!-- right -->
    <!-- Bottom fence with gate gap -->
    <div class="fence-h" style="bottom:60px;left:0;width:195px;"></div>
    <div class="fence-h" style="bottom:60px;right:0;width:195px;"></div>
    <!-- Gate in center bottom -->
    <div class="gate" id="gate-town" style="bottom:10px;left:50%;transform:translateX(-50%);" data-text="The gate to the street. Town is out there."></div>

    <!-- MAILBOX -->
    <div class="object mailbox" style="top:118px;left:20px;" data-text="Your mailbox. Looks empty today."></div>

    <!-- TREES in yard -->
    <div class="object tree" style="top:160px;left:30px;"></div>
    <div class="object tree" style="top:180px;right:30px;"></div>
    <div class="object tree" style="top:320px;left:50px;"></div>
    <div class="object tree" style="top:300px;right:50px;"></div>

    <!-- STREET LAMP -->
    <div class="object" style="top:580px;left:80px;width:6px;height:60px;background:#5a5a6a;border:1px solid #3a3a4a;"></div>
    <div class="object" style="top:574px;left:74px;width:18px;height:8px;background:#8a8a9a;border-radius:2px;box-shadow:0 0 12px 6px rgba(255,220,100,0.4);" data-text="A street lamp. The light flickers slightly."></div>

    <!-- TOWN SIGN -->
    <div class="town-sign" id="town-exit" data-text="The street. Town is just ahead.">▼ TO TOWN</div>

    <div class="darkness"></div>
    <div class="spotlight" id="spotlight"></div>
    <div class="heart" id="heart"></div>
    <div class="hint" id="hint">Press ● to interact</div>
  </div>

  <div class="dialog" id="dialog"></div>
  <button id="phone-btn">📱</button>
  <div class="controls">
    <button class="btn up">↑</button>
    <button class="btn left">←</button>
    <button class="btn down">↓</button>
    <button class="btn right">→</button>
  </div>
  <button class="interact" id="interact-btn">●</button>
</div>
<script>
const heart=document.getElementById('heart'),world=document.getElementById('world'),game=document.getElementById('game'),dialog=document.getElementById('dialog'),spotlight=document.getElementById('spotlight'),hint=document.getElementById('hint');
const WORLD_W=480,WORLD_H=800,GAME_W=360,GAME_H=640,PW=28,PH=24,SPEED=2.5;
let px=220,py=140,dialogOpen=false;
let keys={up:false,down:false,left:false,right:false};

const collidables=[
  [0,0,WORLD_W,8],[0,0,8,WORLD_H],[WORLD_W-8,0,8,WORLD_H],[0,WORLD_H-8,WORLD_W,8],
  // House wall
  [100,40,280,100],
  // Fences
  [0,100,WORLD_W,12],     // top fence
  [0,100,12,660],         // left fence
  [WORLD_W-12,100,12,660],// right fence
  [0,728,195,12],         // bottom fence left
  [285,728,195,12],       // bottom fence right
];
function isColliding(nx,ny){for(const[cx,cy,cw,ch]of collidables){if(nx<cx+cw&&nx+PW>cx&&ny<cy+ch&&ny+PH>cy)return true;}return false;}

const allObjs=document.querySelectorAll('[data-text]');
function getNearby(){
  for(const obj of allObjs){
    const ox=parseInt(obj.style.left)||0,oy=parseInt(obj.style.top)||0;
    // special: house-door and gate-town use bottom/transform — need manual positions
    let rx=ox,ry=oy;
    if(obj.id==='door-house'){rx=218;ry=100;}
    if(obj.id==='gate-town'){rx=215;ry=708;}
    if(obj.id==='town-exit'){rx=180;ry=715;}
    const ow=obj.offsetWidth||44,oh=obj.offsetHeight||44;
    const dx=Math.abs(px+PW/2-(rx+ow/2)),dy=Math.abs(py+PH/2-(ry+oh/2));
    if(dx<ow/2+PW/2+24&&dy<oh/2+PH/2+28)return{obj,rx,ry,ow,oh};
  }return null;
}

function interact(){
  if(dialogOpen){closeDialog();return;}
  const res=getNearby();if(!res)return;
  const{obj}=res;
  const text=obj.dataset.text;
  if(obj.id==='door-house'){
    showDialog(`${text}<br><br><button onclick="window.location.href='livingroom.html'">Go Inside</button><button onclick="closeDialog()">Stay</button>`);
  }else if(obj.id==='gate-town'||obj.id==='town-exit'){
    showDialog(`${text}<br><br><button onclick="window.location.href='town.html'">Head to Town</button><button onclick="closeDialog()">Not yet</button>`);
  }else{
    showDialog(text+'<br><br><button onclick="closeDialog()">OK</button>');
  }
}
function showDialog(h){dialog.innerHTML=h;dialog.style.display='block';dialogOpen=true;}
function closeDialog(){dialog.style.display='none';dialogOpen=false;}
window.closeDialog=closeDialog;

function update(){
  if(!dialogOpen){
    let nx=px,ny=py;
    if(keys.up)ny-=SPEED;if(keys.down)ny+=SPEED;if(keys.left)nx-=SPEED;if(keys.right)nx+=SPEED;
    if(!isColliding(nx,py))px=nx;if(!isColliding(px,ny))py=ny;
    px=Math.max(8,Math.min(WORLD_W-PW-8,px));py=Math.max(8,Math.min(WORLD_H-PH-8,py));
  }
  heart.style.left=px+'px';heart.style.top=py+'px';
  spotlight.style.left=(px-86)+'px';spotlight.style.top=(py-86)+'px';
  let camX=px-GAME_W/2+PW/2,camY=py-GAME_H/2+PH/2;
  camX=Math.max(0,Math.min(WORLD_W-GAME_W,camX));camY=Math.max(0,Math.min(WORLD_H-GAME_H,camY));
  world.style.transform=`translate(${-camX}px,${-camY}px)`;
  const res=getNearby();
  if(res){hint.style.display='block';hint.style.left=(res.rx-camX+res.ow/2-40)+'px';hint.style.top=(res.ry-camY-18)+'px';}
  else hint.style.display='none';
  requestAnimationFrame(update);
}
update();
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){keys.up=true;e.preventDefault();}if(e.key==='ArrowDown'){keys.down=true;e.preventDefault();}if(e.key==='ArrowLeft'){keys.left=true;e.preventDefault();}if(e.key==='ArrowRight'){keys.right=true;e.preventDefault();}if(e.key==='e'||e.key==='Enter')interact();});
document.addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=false;if(e.key==='ArrowDown')keys.down=false;if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;});
function bindBtn(sel,key){const b=document.querySelector(sel);if(!b)return;b.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false},{passive:false});b.addEventListener('mousedown',()=>keys[key]=true);b.addEventListener('mouseup',()=>keys[key]=false);b.addEventListener('mouseleave',()=>keys[key]=false);}
bindBtn('.up','up');bindBtn('.down','down');bindBtn('.left','left');bindBtn('.right','right');
document.getElementById('interact-btn').addEventListener('click',interact);
document.getElementById('phone-btn').onclick=()=>window.location.href='phone.html';
</script>
</body>
</html>
