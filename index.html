<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Game</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Game container */
.game {
    width: 360px;
    height: 640px;
    background: #1e1e2f;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
}

/* Pixel heart */
.heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: red;

    /* Pixel heart with black outline */
    box-shadow:
    /* --- BLACK OUTLINE --- */
    6px 0 black, 12px 0 black, 18px 0 black, 24px 0 black,
    0 6px black, 30px 6px black,
    0 12px black, 30px 12px black,
    6px 18px black, 24px 18px black,
    12px 24px black, 18px 24px black,

    /* --- RED FILL --- */
    12px 6px red, 18px 6px red,
    6px 12px red, 12px 12px red, 18px 12px red, 24px 12px red,
    6px 18px red, 12px 18px red, 18px 18px red, 24px 18px red;
}

/* Objects */
.object {
    position: absolute;
    width: 40px;
    height: 40px;
    background: #6cf;
    border-radius: 8px;
}

/* Dialog box */
.dialog {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 15px;
    font-size: 14px;
    display: none;
}

/* Controls */
.controls {
    position: absolute;
    bottom: 80px;
    left: 20px;
    display: grid;
    grid-template-columns: repeat(3, 55px);
    grid-template-rows: repeat(2, 55px);
    gap: 6px;
}

.btn {
    background: #444;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
}

.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

/* Interact button */
.interact {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 70px;
    height: 50px;
    background: #ffcc00;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="game" id="game">
    <div class="heart" id="heart"></div>

    <!-- Objects -->
    <div class="object" style="top:100px; left:100px;" data-text="A dying tree. The air feels heavy."></div>
    <div class="object" style="top:300px; left:200px;" data-text="Plastic waste... no one cleaned this for years."></div>
    <div class="object" style="top:200px; left:50px;" data-text="The river used to be clear here."></div>

    <!-- Dialog -->
    <div class="dialog" id="dialog"></div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn up">↑</button>
        <button class="btn left">←</button>
        <button class="btn down">↓</button>
        <button class="btn right">→</button>
    </div>

    <button class="interact">E</button>
</div>

<script>
const heart = document.getElementById("heart");
const game = document.getElementById("game");
const dialog = document.getElementById("dialog");
const objects = document.querySelectorAll(".object");

let x = 150;
let y = 300;
const speed = 2;

let keys = { up:false, down:false, left:false, right:false };

/* Movement loop */
function update() {
    if (keys.up) y -= speed;
    if (keys.down) y += speed;
    if (keys.left) x -= speed;
    if (keys.right) x += speed;

    x = Math.max(0, Math.min(game.clientWidth - 60, x));
    y = Math.max(0, Math.min(game.clientHeight - 60, y));

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    requestAnimationFrame(update);
}
update();

/* Interaction check */
function interact() {
    for (let obj of objects) {
        const ox = obj.offsetLeft;
        const oy = obj.offsetTop;

        const distance = Math.hypot(x - ox, y - oy);

        if (distance < 60) {
            dialog.innerText = obj.dataset.text;
            dialog.style.display = "block";
            return;
        }
    }

    dialog.style.display = "none";
}

/* Keyboard */
document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") keys.up = true;
    if (e.key === "ArrowDown") keys.down = true;
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
    if (e.key.toLowerCase() === "e") interact();
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowUp") keys.up = false;
    if (e.key === "ArrowDown") keys.down = false;
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
});

/* Mobile controls */
function bind(btn, key) {
    btn.addEventListener("touchstart", e => { e.preventDefault(); keys[key]=true; });
    btn.addEventListener("touchend", () => keys[key]=false);
    btn.addEventListener("mousedown", () => keys[key]=true);
    btn.addEventListener("mouseup", () => keys[key]=false);
}

bind(document.querySelector(".up"), "up");
bind(document.querySelector(".down"), "down");
bind(document.querySelector(".left"), "left");
bind(document.querySelector(".right"), "right");

/* Interact button */
document.querySelector(".interact").addEventListener("click", interact);
</script>

</body>
</html>
