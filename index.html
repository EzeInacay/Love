<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Game</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CAMERA */
.game {
    width: 360px;
    height: 640px;
    overflow: hidden;
    position: relative;
    background: black;
    border-radius: 20px;
}

/* SMALLER ROOM */
.world {
    width: 520px;
    height: 600px;
    position: absolute;
    background: #2a2a3d;
}

/* LIGHT */
.light {
    position: absolute;
    width: 180px;
    height: 180px;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.9) 70%);
}

/* PLAYER */
.heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: red;
}

/* OBJECT BASE */
.object {
    position: absolute;
    border: 2px dashed rgba(255,255,255,0.2); /* placeholder */
}

/* SOLID OBJECTS */
.solid { background: rgba(255,255,255,0.05); }

/* NON-SOLID */
.nonsolid { background: rgba(100,100,255,0.2); }

/* Layout */
.bed { width: 100px; height: 50px; }
.table { width: 40px; height: 120px; } /* vertical */
.drawer { width: 50px; height: 50px; }
.carpet { width: 160px; height: 100px; }
.door { width: 40px; height: 70px; }
.gym { width: 120px; height: 30px; }

/* Dialog */
.dialog {
    position: absolute;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 10px;
    display: none;
}

/* Choices */
.choices {
    margin-top: 10px;
}
.choice-btn {
    background: #444;
    color: white;
    border: none;
    margin-right: 5px;
    padding: 5px 10px;
}

/* Controls */
.controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px;
    gap: 6px;
}

.btn {
    background: #333;
    color: white;
    border: none;
    border-radius: 10px;
}

/* Interact */
.interact {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    border: 3px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
}
.interact::after {
    content: "";
    width: 30px;
    height: 30px;
    background: #ffcc00;
    border-radius: 50%;
}
</style>
</head>

<body>

<div class="game" id="game">
    <div class="world" id="world">

        <div class="light" id="light"></div>
        <div class="heart" id="heart"></div>

        <!-- OBJECTS -->
        <div class="object bed solid" style="top:30px; left:30px;" data-text="Your bed."></div>

        <!-- TABLE now vertical -->
        <div class="object table solid" style="top:30px; left:140px;" data-text="A standing desk setup."></div>

        <div class="object drawer solid" style="top:30px; left:200px;" data-text="Drawer."></div>

        <!-- CARPET NON SOLID -->
        <div class="object carpet nonsolid" style="top:200px; left:180px;" data-text="Carpet."></div>

        <div class="object door solid" style="top:220px; left:480px;" data-text="Leave the room?"></div>

        <div class="object gym solid" style="top:520px; left:180px;" data-text="Workout area."></div>

    </div>

    <div class="dialog" id="dialog"></div>

    <div class="controls">
        <button class="btn up">↑</button>
        <button class="btn left">←</button>
        <button class="btn down">↓</button>
        <button class="btn right">→</button>
    </div>

    <button class="interact"></button>
</div>

<script>
const heart = document.getElementById("heart");
const world = document.getElementById("world");
const game = document.getElementById("game");
const dialog = document.getElementById("dialog");
const light = document.getElementById("light");

const objects = document.querySelectorAll(".object");

let x = 150, y = 150;
const speed = 2;
let keys = {up:false,down:false,left:false,right:false};

/* COLLISION (only solid objects) */
function isColliding(nx, ny) {
    for (let obj of objects) {
        if (!obj.classList.contains("solid")) continue;

        const ox = obj.offsetLeft;
        const oy = obj.offsetTop;

        if (
            nx < ox + obj.offsetWidth &&
            nx + 20 > ox &&
            ny < oy + obj.offsetHeight &&
            ny + 20 > oy
        ) return true;
    }
    return false;
}

/* LOOP */
function update() {
    let nx = x;
    let ny = y;

    if (keys.up) ny -= speed;
    if (keys.down) ny += speed;
    if (keys.left) nx -= speed;
    if (keys.right) nx += speed;

    if (!isColliding(nx, y)) x = nx;
    if (!isColliding(x, ny)) y = ny;

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    light.style.left = (x - 90) + "px";
    light.style.top = (y - 90) + "px";

    updateCamera();
    requestAnimationFrame(update);
}
update();

/* CAMERA */
function updateCamera() {
    let camX = x - game.clientWidth / 2;
    let camY = y - game.clientHeight / 2;

    camX = Math.max(0, Math.min(world.clientWidth - game.clientWidth, camX));
    camY = Math.max(0, Math.min(world.clientHeight - game.clientHeight, camY));

    world.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

/* INTERACTION (EDGE-BASED) */
function isNear(obj) {
    const ox = obj.offsetLeft;
    const oy = obj.offsetTop;

    const px = x + 10;
    const py = y + 10;

    return (
        px > ox - 40 &&
        px < ox + obj.offsetWidth + 40 &&
        py > oy - 40 &&
        py < oy + obj.offsetHeight + 40
    );
}

let timeout;

function interact() {
    for (let obj of objects) {
        if (!isNear(obj)) continue;

        const text = obj.dataset.text;

        /* DOOR SPECIAL CASE */
        if (obj.classList.contains("door")) {
            dialog.innerHTML = `
                ${text}
                <div class="choices">
                    <button class="choice-btn" onclick="goOutside()">Yes</button>
                    <button class="choice-btn" onclick="closeDialog()">No</button>
                </div>
            `;
            dialog.style.display = "block";
            return;
        }

        dialog.innerText = text;
        dialog.style.display = "block";

        clearTimeout(timeout);
        timeout = setTimeout(() => {
            dialog.style.display = "none";
        }, text.split(" ").length * 1000);

        return;
    }
}

/* DOOR ACTION */
function goOutside() {
    window.location.href = "https://your-link-here.com"; // replace later
}

/* CLOSE */
function closeDialog() {
    dialog.style.display = "none";
}

/* INPUT */
document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") keys.up=true;
    if(e.key==="ArrowDown") keys.down=true;
    if(e.key==="ArrowLeft") keys.left=true;
    if(e.key==="ArrowRight") keys.right=true;
    if(e.key==="e") interact();
});
document.addEventListener("keyup", e=>{
    if(e.key==="ArrowUp") keys.up=false;
    if(e.key==="ArrowDown") keys.down=false;
    if(e.key==="ArrowLeft") keys.left=false;
    if(e.key==="ArrowRight") keys.right=false;
});

/* MOBILE */
function bind(sel,key){
    const b=document.querySelector(sel);
    b.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true});
    b.addEventListener("touchend",()=>keys[key]=false);
}
bind(".up","up"); bind(".down","down"); bind(".left","left"); bind(".right","right");

document.querySelector(".interact").onclick = interact;
</script>

</body>
</html>
