<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone View</title>
<style>
/* Keep most styles the same as game.css */
body { margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; }
.game { width:360px; height:640px; overflow:hidden; position:relative; background:black; border-radius:20px; }

/* Pointer instead of heart */
.pointer {
    position:absolute;
    width:10px;
    height:10px;
    background: yellow;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* Keep object and other styles as in game.css */

/* Home Button */
.home-btn {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:70px;
    height:70px;
    background:#222;
    border-radius:50%;
    border:3px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:24px;
    z-index:10;
}
</style>
</head>
<body>

<div class="game" id="game">
    <div class="world" id="world">
        <div class="light" id="light"></div>
        <div class="pointer" id="pointer"></div>

        <!-- OBJECTS -->
        <div class="object bed" style="top:40px; left:40px;" data-text="Your bed." data-radius="70"></div>
        <div class="object table" style="top:100px; left:40px; width:40px; height:120px;" data-text="A laptop sits here." data-radius="60"></div>
        <div class="object drawer" style="top:40px; left:150px;" data-text="Clothes inside." data-radius="50"></div>
        <div class="object carpet" style="top:250px; left:200px;" data-text="Soft carpet." data-radius="70" data-collidable="false"></div>
        <div class="object door" style="top:480px; left:450px;" data-text="Exit door." data-radius="80"></div>
        <!-- Add other objects as needed -->
    </div>

    <div class="dialog" id="dialog"></div>

    <div class="controls">
        <button class="btn up">↑</button>
        <button class="btn left">←</button>
        <button class="btn down">↓</button>
        <button class="btn right">→</button>
    </div>

    <button class="home-btn" id="home-btn">🏠</button>
</div>

<script>
// Pointer movement same as heart
const pointer = document.getElementById("pointer");
const world = document.getElementById("world");
const game = document.getElementById("game");
const dialog = document.getElementById("dialog");
const objects = document.querySelectorAll(".object");

let x = 200, y = 200;
const speed = 2;
let keys = {up:false,down:false,left:false,right:false};

/* COLLISION (same as before) */
function isColliding(nx, ny) {
    for (let obj of objects) {
        if (obj.dataset.collidable === "false") continue;
        const r = obj.getBoundingClientRect();
        const wr = world.getBoundingClientRect();
        const ox = r.left - wr.left;
        const oy = r.top - wr.top;
        if (
            nx < ox + obj.offsetWidth &&
            nx + 20 > ox &&
            ny < oy + obj.offsetHeight &&
            ny + 20 > oy
        ) return true;
    }
    return false;
}

/* UPDATE LOOP */
function update() {
    let nx = x;
    let ny = y;

    if(keys.up) ny -= speed;
    if(keys.down) ny += speed;
    if(keys.left) nx -= speed;
    if(keys.right) nx += speed;

    if(!isColliding(nx, y)) x = nx;
    if(!isColliding(x, ny)) y = ny;

    x = Math.max(0, Math.min(world.clientWidth-30, x));
    y = Math.max(0, Math.min(world.clientHeight-30, y));

    pointer.style.left = x + "px";
    pointer.style.top = y + "px";

    light.style.left = (x-100)+"px";
    light.style.top = (y-100)+"px";

    updateCamera();
    requestAnimationFrame(update);
}
update();

/* CAMERA */
function updateCamera() {
    let camX = x - game.clientWidth/2;
    let camY = y - game.clientHeight/2;
    camX = Math.max(0, Math.min(world.clientWidth - game.clientWidth, camX));
    camY = Math.max(0, Math.min(world.clientHeight - game.clientHeight, camY));
    world.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

/* INTERACT */
let t;
function interact() {
    for (let obj of objects) {
        const ox = obj.offsetLeft + (parseInt(obj.dataset.offsetX)||0);
        const oy = obj.offsetTop + (parseInt(obj.dataset.offsetY)||0);
        const d = Math.hypot(x - ox, y - oy);
        const interactRadius = (parseInt(obj.dataset.radius)||50);

        if(d < interactRadius) {
            const text = obj.dataset.text;
            if(obj.classList.contains("door")) {
                dialog.innerHTML = `${text} <br><button id="go-out">Go Outside</button>`;
                document.getElementById("go-out").onclick = ()=> window.location.href="https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            } else dialog.innerText = text;

            dialog.style.display = "block";
            clearTimeout(t);
            t = setTimeout(()=> dialog.style.display="none", text.split(" ").length*1000);
            return;
        }
    }
}

/* INPUT */
document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") keys.up=true;
    if(e.key==="ArrowDown") keys.down=true;
    if(e.key==="ArrowLeft") keys.left=true;
    if(e.key==="ArrowRight") keys.right=true;
    if(e.key==="e") interact();
});
document.addEventListener("keyup", e=>{
    if(e.key==="ArrowUp") keys.up=false;
    if(e.key==="ArrowDown") keys.down=false;
    if(e.key==="ArrowLeft") keys.left=false;
    if(e.key==="ArrowRight") keys.right=false;
});

/* MOBILE BUTTONS */
function bind(sel,key){
    const b=document.querySelector(sel);
    b.addEventListener("touchstart", e=>{e.preventDefault(); keys[key]=true});
    b.addEventListener("touchend", ()=>keys[key]=false);
    b.addEventListener("mousedown", ()=>keys[key]=true);
    b.addEventListener("mouseup", ()=>keys[key]=false);
}
bind(".up","up"); bind(".down","down"); bind(".left","left"); bind(".right","right");

document.querySelector(".interact")?.onclick = interact;

/* HOME BUTTON */
document.getElementById("home-btn").onclick = () => {
    window.location.href = "index.html";
};
</script>
</body>
</html>
