<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    /* LIGHT BLUE GRADIENT */
    background: black;
}

/* PHONE SCREEN */
.phone {
    width: 360px;
    height: 640px;
    overflow: hidden;
    position: relative;
    border-radius: 20px;
    background: linear-gradient(to bottom, #aee2ff, #e6f7ff);
}

/* CLOCK */
.clock {
    position: absolute;
    top: 35%;
    width: 100%;
    text-align: center;
    color: #033;
}

.time {
    font-size: 60px;
    font-weight: bold;
}

.date {
    font-size: 18px;
}

/* BOTTOM BAR */
.bottom-bar {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* HOME BUTTON */
.home {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    border: 3px solid #333; /* outline */
    margin: 0 20px;
}

/* CAMERA BUTTON */
.camera {
    position: absolute;
    left: 80px;
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: 3px solid #333; /* outline */
    background: white;
}

/* YOUTUBE BUTTON */
.youtube {
    position: absolute;
    right: 80px;
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: 3px solid #333; /* outline */
    background: white;
    font-size: 18px;
}

/* IMAGE POPUP */
.popup {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
}

.popup img {
    width: 100%;
    height: 100%;
    object-fit: cover;

}

.close-btn {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;
}
.camera, .home, .youtube {
    box-shadow: 0 4px 0 #888;
    transition: all 0.1s ease;
}

.camera:active, .home:active, .youtube:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #888;
}
</style>
</head>

<body>

<div class="phone">

    <!-- CLOCK -->
    <div class="clock">
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
    </div>

    <div class="popup" id="popup">
        <button class="close-btn" onclick="closePopup()">←</button>
        <img src="Monkey.webp" id="photo">
    </div>
    
    <!-- BOTTOM CONTROLS -->
    <div class="bottom-bar">
        <button class="camera" onclick="openCamera()">📷</button>
        <button class="home" onclick="goHome()"></button>
        <button class="youtube" onclick="openYouTube()">▶️</button>
    </div>

</div>

<script>
/* CLOCK */
function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const date = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});

    document.getElementById("time").innerText = time;
    document.getElementById("date").innerText = date;
}

setInterval(updateClock, 1000);
updateClock();

/* HOME */
function goHome() {
    window.location.href = "index.html";
}
/* CAMERA */
function openCamera() {
    const popup = document.getElementById("popup");
    popup.style.display = "block";
}

/* CLOSE BUTTON */
function closePopup() {
    const popup = document.getElementById("popup");
    popup.style.display = "none";
}
function openYouTube() {
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");
}
</script>

</body>
</html>
