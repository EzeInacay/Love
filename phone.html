<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* LIGHT BLUE GRADIENT */
    background: linear-gradient(to bottom, #aee2ff, #e6f7ff);
}

/* PHONE SCREEN */
.phone {
    width: 360px;
    height: 640px;
    position: relative;
    border-radius: 25px;
    overflow: hidden;
}

/* CLOCK */
.clock {
    position: absolute;
    top: 35%;
    width: 100%;
    text-align: center;
    color: #033;
}

.time {
    font-size: 60px;
    font-weight: bold;
}

.date {
    font-size: 18px;
}

/* BOTTOM BAR */
.bottom-bar {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* HOME BUTTON */
.home {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    border: none;
    margin: 0 20px;
}

/* CAMERA BUTTON */
.camera {
    position: absolute;
    left: 80px;
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: none;
    background: white;
}

/* IMAGE POPUP */
.popup {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
}

.popup img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="phone">

    <!-- CLOCK -->
    <div class="clock">
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
    </div>

    <!-- IMAGE POPUP -->
    <div class="popup" id="popup">
        <!-- PLACEHOLDER IMAGE -->
        <img src="https://via.placeholder.com/360x640" id="photo">
    </div>

    <!-- BOTTOM CONTROLS -->
    <div class="bottom-bar">
        <button class="camera" onclick="openCamera()">📷</button>
        <button class="home" onclick="goHome()"></button>
    </div>

</div>

<script>
/* CLOCK */
function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const date = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});

    document.getElementById("time").innerText = time;
    document.getElementById("date").innerText = date;
}

setInterval(updateClock, 1000);
updateClock();

/* HOME */
function goHome() {
    window.location.href = "index.html";
}

/* CAMERA */
function openCamera() {
    const popup = document.getElementById("popup");
    popup.style.display = "block";
}

/* CLOSE POPUP WHEN CLICKED */
document.getElementById("popup").onclick = function() {
    this.style.display = "none";
};
</script>

</body>
</html>
