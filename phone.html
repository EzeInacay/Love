<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}
.phone {
    width: 360px;
    height: 640px;
    position: relative;
    border-radius: 0;
    overflow: hidden;
    background: linear-gradient(160deg, #6ec6f5 0%, #b8e4ff 35%, #d8f0ff 60%, #e8f8ff 100%);
}

/* Subtle cloud blobs */
.phone::before {
    content:'';
    position:absolute;
    width:200px; height:80px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    top: 80px; left: -30px;
    pointer-events:none;
}
.phone::after {
    content:'';
    position:absolute;
    width:160px; height:60px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    top: 120px; right: -20px;
    pointer-events:none;
}

/* STATUS BAR */
.statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 11px;
    color: rgba(0,60,100,0.7);
    font-family: monospace;
}

/* CLOCK */
.clock-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.time {
    font-size: 72px;
    font-weight: 200;
    color: #003a60;
    letter-spacing: -2px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 2px 12px rgba(0,80,160,0.15);
    line-height: 1;
}
.date {
    font-size: 15px;
    color: #004a70;
    margin-top: 10px;
    font-family: monospace;
    letter-spacing: 0.5px;
}

/* WALLPAPER IMAGE (placeholder spot) */
.wallpaper-hint {
    position: absolute;
    top: 80px; left: 30px; right: 30px;
    height: 0; /* invisible by default */
}

/* BOTTOM BAR */
.bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 90px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
}

.phone-btn {
    width: 56px; height: 56px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 2px 8px rgba(0,60,120,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
    margin: 0 18px;
}
.phone-btn:active {
    transform: scale(0.92);
    box-shadow: 0 1px 4px rgba(0,60,120,0.1);
}
.home-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 3px 12px rgba(0,60,120,0.2);
    border: 2px solid rgba(200,230,255,0.8);
}

/* IMAGE POPUP */
.popup {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.popup.active { display: flex; }
.popup-img {
    width: 100%; height: 100%;
    object-fit: cover;
}
/* PLACEHOLDER when no real image */
.popup-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-family: monospace;
    font-size: 13px;
    text-align: center;
    gap: 12px;
}
.popup-placeholder .icon { font-size: 48px; opacity: 0.5; }
.close-popup {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 60;
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<div class="phone">

  <!-- STATUS BAR -->
  <div class="statusbar">
    <span id="sb-time">12:00</span>
    <span>📶 🔋</span>
  </div>

  <!-- CLOCK -->
  <div class="clock-wrap">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">Loading...</div>
  </div>

  <!-- IMAGE POPUP -->
  <div class="popup" id="popup">
    <button class="close-popup" onclick="closePopup()">←</button>
    <img class="popup-img" src="Monkey.webp" alt="photo">
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button class="phone-btn" title="Camera" onclick="openPopup()">📷</button>
    <button class="phone-btn home-btn" title="Home" onclick="goHome()"></button>
    <button class="phone-btn" title="YouTube" onclick="openYT()">▶️</button>
  </div>

</div>

<script>
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const timeStr = `${h}:${m}`;

    document.getElementById('time').textContent = timeStr;
    document.getElementById('sb-time').textContent = timeStr;

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    document.getElementById('date').textContent = dateStr;
}
setInterval(updateClock, 1000);
updateClock();

function goHome()   { window.location.href = 'index.html'; }
function openPopup(){ document.getElementById('popup').classList.add('active'); }
function closePopup(){ document.getElementById('popup').classList.remove('active'); }
function openYT()   { window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ','_blank'); }
</script>
</body>
</html>
