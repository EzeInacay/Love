<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hallway</title>

<style>
body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.game {
    width: 360px;
    height: 640px;
    overflow: hidden;
    position: relative;
    background: black;
    border-radius: 20px;
}

.world {
    width: 600px;
    height: 700px;
    position: absolute;
    background: #2a2a3d;
}

.heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: red;
    box-shadow:
        6px 0 black, 12px 0 black, 18px 0 black, 24px 0 black,
        0 6px black, 30px 6px black,
        0 12px black, 30px 12px black,
        6px 18px black, 24px 18px black,
        12px 24px black, 18px 24px black,

        12px 6px red, 18px 6px red,
        6px 12px red, 12px 12px red, 18px 12px red, 24px 12px red,
        6px 18px red, 12px 18px red, 18px 18px red, 24px 18px red;
}

.object { position:absolute; background:#663; width:40px; height:70px; }

.wall { position:absolute; background:#111; }

.dialog {
    position:absolute; top:0; width:100%;
    background:rgba(0,0,0,0.8); color:white;
    display:none; padding:10px;
}
.light {
    position:absolute;
    width:200px;
    height:200px;
    pointer-events:none;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.9) 70%);
}

.controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px;
    gap: 6px;
    z-index: 10;
}

.btn {
    background: #333;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

/* INTERACT BUTTON */
.interact {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 70px;
    height: 70px;
    background: #222;
    border-radius: 50%;
    border: 3px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
}

.interact::after {
    content: "";
    width: 30px;
    height: 30px;
    background: #ffcc00;
    border-radius: 50%;
}
</style>
</head>

<body>

<div class="game" id="game">
    <div class="world" id="world">

        <div class="light" id="light"></div>
        <div class="heart" id="heart"></div>

        <!-- WALLS (top & bottom) -->
        <div class="wall" style="top:0; left:0; width:1200px; height:40px;"></div>
        <div class="wall" style="bottom:0; left:0; width:1200px; height:40px;"></div>

        <!-- DEAD END WALL (left) -->
        <div class="wall" style="top:0; left:0; width:40px; height:400px;"></div>

        <!-- YOUR ROOM -->
        <div class="object door room"
         style="top:150px; left:800px;"
         data-text="Your room"
         data-radius="100"
         data-collidable="false"></div>

        <!-- NEIGHBOR -->
        <div class="object door neighbor"
         style="top:150px; left:900px;"
         data-text="Neighbor's room"
         data-radius="100"
         data-collidable="false"></div>

        <!-- LIVING ROOM -->
        <div class="object door living"
        style="top:150px; left:1100px;"
         data-text="Living Room"
         data-radius="120"
         data-collidable="false"></div>

    </div>

    <div class="dialog" id="dialog"></div>
    <button id="phone-btn" style="
    position:absolute;
    top:10px;
    right:10px;
    width:50px;
    height:50px;
    border-radius:10px;
    background:#222;
    color:white;
    border:none;
    font-size:18px;
    z-index:20;"  >📱</button>
    <div class="controls">
        <button class="btn up"></button>
        <button class="btn left"></button>
        <button class="btn down"></button>
        <button class="btn right"></button>
    </div>

    <button class="interact"></button>
</div>

<button class="interact"></button>
</div>

<script>
const heart = document.getElementById("heart");
const world = document.getElementById("world");
const game = document.getElementById("game");
const dialog = document.getElementById("dialog");
const light = document.getElementById("light");

const objects = document.querySelectorAll(".object");

let x = 0, y = 0;
const speed = 2;

let keys = {up:false,down:false,left:false,right:false};

/* INIT (per room) */
function initGame(config) {
    x = config.spawn.x;
    y = config.spawn.y;

    world.style.width = config.worldSize.width + "px";
    world.style.height = config.worldSize.height + "px";
}

/* COLLISION */
function isColliding(nx, ny) {
    for (let obj of objects) {
        if (obj.dataset.collidable === "false") continue;

        const r = obj.getBoundingClientRect();
        const wr = world.getBoundingClientRect();

        const ox = r.left - wr.left;
        const oy = r.top - wr.top;

        if (
            nx < ox + obj.offsetWidth &&
            nx + 20 > ox &&
            ny < oy + obj.offsetHeight &&
            ny + 20 > oy
        ) return true;
    }
    return false;
}

/* LOOP */
function update() {
    let nx = x;
    let ny = y;

    if (keys.up) ny -= speed;
    if (keys.down) ny += speed;
    if (keys.left) nx -= speed;
    if (keys.right) nx += speed;

    if (!isColliding(nx, y)) x = nx;
    if (!isColliding(x, ny)) y = ny;

    x = Math.max(0, Math.min(world.clientWidth - 30, x));
    y = Math.max(0, Math.min(world.clientHeight - 30, y));

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    light.style.left = (x - 100) + "px";
    light.style.top = (y - 100) + "px";

    updateCamera();
    requestAnimationFrame(update);
}
update();

/* CAMERA */
function updateCamera() {
    let camX = x - game.clientWidth / 2;
    let camY = y - game.clientHeight / 2;

    camX = Math.max(0, Math.min(world.clientWidth - game.clientWidth, camX));
    camY = Math.max(0, Math.min(world.clientHeight - game.clientHeight, camY));

    world.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

/* INTERACT (same logic reused) */
function interact() {
    for (let obj of objects) {
        const ox = obj.offsetLeft;
        const oy = obj.offsetTop;
        const d = Math.hypot(x - ox, y - oy);

        if (d < (parseInt(obj.dataset.radius) || 60)) {

            const text = obj.dataset.text;

            // 🚪 DOORS
            if (obj.classList.contains("door")) {
                dialog.innerHTML = `
                    ${text} <br>
                    <button id="go">Go Through</button>
                    <button id="stay">Stay</button>
                `;

                document.getElementById("go").onclick = () => {

                    if (obj.classList.contains("room")) {
                        window.location.href = "index.html";
                    }
                    else if (obj.classList.contains("living")) {
                        window.location.href = "livingroom.html";
                    }
                    else if (obj.classList.contains("neighbor")) {
                        alert("It's locked."); // placeholder
                    }
                };

                document.getElementById("stay").onclick = () => {
                    dialog.style.display = "none";
                };
            }

            // DEFAULT
            else {
                dialog.innerText = text;
            }

            dialog.style.display = "block";
            return;
        }
    }
}

/* INPUT */
document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") keys.up=true;
    if(e.key==="ArrowDown") keys.down=true;
    if(e.key==="ArrowLeft") keys.left=true;
    if(e.key==="ArrowRight") keys.right=true;
    if(e.key==="e") interact();
});
document.addEventListener("keyup", e=>{
    if(e.key==="ArrowUp") keys.up=false;
    if(e.key==="ArrowDown") keys.down=false;
    if(e.key==="ArrowLeft") keys.left=false;
    if(e.key==="ArrowRight") keys.right=false;
});

/* MOBILE CONTROLS */
function bind(sel,key){
    const b=document.querySelector(sel);
    b.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true});
    b.addEventListener("touchend",()=>keys[key]=false);
    b.addEventListener("mousedown",()=>keys[key]=true);
    b.addEventListener("mouseup",()=>keys[key]=false);
}
bind(".up","up"); bind(".down","down"); bind(".left","left"); bind(".right","right");

document.querySelector(".interact").onclick = interact;
initGame({
    spawn: { x: 750, y: 200 }
});
</script>

</body>
</html>
