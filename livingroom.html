<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Living Room</title>

<style>
body { margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; }

.game {
    width:360px; height:640px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:#3a3a4d;
}

.object {
    position:absolute;
    width:40px; height:70px;
    background:#663;
}

.heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: red;
    box-shadow:
        6px 0 black, 12px 0 black, 18px 0 black, 24px 0 black,
        0 6px black, 30px 6px black,
        0 12px black, 30px 12px black,
        6px 18px black, 24px 18px black,
        12px 24px black, 18px 24px black,

        12px 6px red, 18px 6px red,
        6px 12px red, 12px 12px red, 18px 12px red, 24px 12px red,
        6px 18px red, 12px 18px red, 18px 18px red, 24px 18px red;
}

.dialog {
    position:absolute;
    top:0; width:100%;
    background:rgba(0,0,0,0.8);
    color:white;
    display:none;
}

.world {
    width: 600px;
    height: 700px;
    position: absolute;
    background: #3a3a4d;
}

.tv {
    background: #222;
    box-shadow: inset 0 0 0 3px black;
}

.sofa {
    background: #884;
    box-shadow: inset 0 0 0 2px black;
}
</style>
</head>

<body>

<div class="game" id="game">

    <div class="world" id="world">

        <div class="heart" id="heart"></div>

        <!-- TV (top wall) -->
        <div class="object tv" style="top:20px; left:180px; width:120px; height:50px;"
             data-text="A TV. Nothing interesting is on."
             data-collidable="false"
             data-radius="90"></div>

        <!-- Sofa -->
        <div class="object sofa" style="top:250px; left:140px; width:160px; height:70px;"
             data-text="A comfy sofa."
             data-radius="80"></div>

        <!-- Basement Door -->
        <div class="object door basement" style="top:200px; left:20px;"
             data-text="Basement door"
             data-collidable="false"
             data-radius="100"></div>

        <!-- Restroom Door -->
        <div class="object door restroom" style="top:300px; left:20px;"
             data-text="Restroom door"
             data-collidable="false"
             data-radius="100"></div>

        <!-- Outside Door -->
        <div class="object door outside" style="top:450px; left:20px;"
             data-text="Door to outside"
             data-collidable="false"
             data-radius="100"></div>

        <!-- Back to Hall -->
        <div class="object door hall" style="top:580px; left:250px;"
             data-text="Back to hallway"
             data-collidable="false"
             data-radius="100"></div>

    </div>

    <div class="dialog" id="dialog"></div>

    <div class="controls">
        <button class="btn up">↑</button>
        <button class="btn left">←</button>
        <button class="btn down">↓</button>
        <button class="btn right">→</button>
    </div>

    <button class="interact"></button>

</div>
<button class="interact"></button>
</div>

<script>
const heart = document.getElementById("heart");
const world = document.getElementById("world");
const game = document.getElementById("game");
const dialog = document.getElementById("dialog");
const light = document.getElementById("light");

const objects = document.querySelectorAll(".object");

let x = 0, y = 0;
const speed = 2;

let keys = {up:false,down:false,left:false,right:false};

/* INIT (per room) */
function initGame(config) {
    x = config.spawn.x;
    y = config.spawn.y;

    world.style.width = config.worldSize.width + "px";
    world.style.height = config.worldSize.height + "px";
}

/* COLLISION */
function isColliding(nx, ny) {
    for (let obj of objects) {
        if (obj.dataset.collidable === "false") continue;

        const r = obj.getBoundingClientRect();
        const wr = world.getBoundingClientRect();

        const ox = r.left - wr.left;
        const oy = r.top - wr.top;

        if (
            nx < ox + obj.offsetWidth &&
            nx + 20 > ox &&
            ny < oy + obj.offsetHeight &&
            ny + 20 > oy
        ) return true;
    }
    return false;
}

/* LOOP */
function update() {
    let nx = x;
    let ny = y;

    if (keys.up) ny -= speed;
    if (keys.down) ny += speed;
    if (keys.left) nx -= speed;
    if (keys.right) nx += speed;

    if (!isColliding(nx, y)) x = nx;
    if (!isColliding(x, ny)) y = ny;

    x = Math.max(0, Math.min(world.clientWidth - 30, x));
    y = Math.max(0, Math.min(world.clientHeight - 30, y));

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    light.style.left = (x - 100) + "px";
    light.style.top = (y - 100) + "px";

    updateCamera();
    requestAnimationFrame(update);
}
update();

/* CAMERA */
function updateCamera() {
    let camX = x - game.clientWidth / 2;
    let camY = y - game.clientHeight / 2;

    camX = Math.max(0, Math.min(world.clientWidth - game.clientWidth, camX));
    camY = Math.max(0, Math.min(world.clientHeight - game.clientHeight, camY));

    world.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

/* INTERACT (same logic reused) */
function interact() {
    for (let obj of objects) {
        const ox = obj.offsetLeft;
        const oy = obj.offsetTop;
        const d = Math.hypot(x - ox, y - oy);

        if (d < (parseInt(obj.dataset.radius) || 60)) {

            const text = obj.dataset.text;

            // 🚪 DOORS
            if (obj.classList.contains("door")) {
                dialog.innerHTML = `
                    ${text} <br>
                    <button id="go">Go Through</button>
                    <button id="stay">Stay</button>
                `;

                document.getElementById("go").onclick = () => {

                    if (obj.classList.contains("hall")) {
                        window.location.href = "hallway.html";
                    }
                    else if (obj.classList.contains("outside")) {
                        window.location.href = "outside.html"; // placeholder
                    }
                    else if (obj.classList.contains("basement")) {
                        window.location.href = "basement.html"; // placeholder
                    }
                    else if (obj.classList.contains("restroom")) {
                        window.location.href = "restroom.html"; // placeholder
                    }
                };

                document.getElementById("stay").onclick = () => {
                    dialog.style.display = "none";
                };
            }

            // 🪑 OTHER OBJECTS
            else {
                dialog.innerText = text;
            }

            dialog.style.display = "block";
            return;
        }
    }
}

/* INPUT */
document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") keys.up=true;
    if(e.key==="ArrowDown") keys.down=true;
    if(e.key==="ArrowLeft") keys.left=true;
    if(e.key==="ArrowRight") keys.right=true;
    if(e.key==="e") interact();
});
document.addEventListener("keyup", e=>{
    if(e.key==="ArrowUp") keys.up=false;
    if(e.key==="ArrowDown") keys.down=false;
    if(e.key==="ArrowLeft") keys.left=false;
    if(e.key==="ArrowRight") keys.right=false;
});

/* MOBILE CONTROLS */
function bind(sel,key){
    const b=document.querySelector(sel);
    b.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true});
    b.addEventListener("touchend",()=>keys[key]=false);
    b.addEventListener("mousedown",()=>keys[key]=true);
    b.addEventListener("mouseup",()=>keys[key]=false);
}
bind(".up","up"); bind(".down","down"); bind(".left","left"); bind(".right","right");

document.querySelector(".interact").onclick = interact;
initGame({
    spawn: { x: 250, y: 500 },
    worldSize: { width: 600, height: 700 }
});
</script>

</body>
</html>
